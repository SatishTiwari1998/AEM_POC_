<h2>Create Your Blog Post</h2>
<div class="post-container">
    <div class="post-form-box">
        <div class="container post-form-container">
            <form id="blogForm" novalidate>
                <!-- Category Radio Buttons Field -->
                <div class="form-group post-form" id="post-form">
                    <label>Category</label>
                    <div class="category-options">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="category" id="categoryTravel" value="travel" required/>
                            <label class="form-check-label" for="categoryTravel">
                                Travel
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="category" id="categoryFood" value="food"/>
                            <label class="form-check-label" for="categoryFood">
                                Food
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="category" id="categoryTech" value="tech"/>
                            <label class="form-check-label" for="categoryTech">
                                Tech
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="category" id="categoryFinance" value="finance"/>
                            <label class="form-check-label" for="categoryFinance">
                                Finance
                            </label>
                        </div>
                        <div class="invalid-feedback">Select a category.</div>
                    </div>
                </div>

                <!-- Blog Title Field -->
                <div class="form-group">
                    <label for="blogTitle">Enter a Blog Title</label>
                    <input type="text" class="form-control" id="blogTitle" name="blogTitle" placeholder="Enter blog title" required/>
                    <div class="invalid-feedback">Please provide a blog title.</div>
                </div>
                
                <!-- Description Field -->
                <div class="form-group">
                    <label for="description">Enter Blog Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Enter blog description" required></textarea>
                    <div class="invalid-feedback">Please provide a description.</div>
                </div>
                
                <!-- Tags Field (Comma-separated values) -->
                <div class="form-group">
                    <label for="tags">Add Tags</label>
                    <input type="text" class="form-control" id="tags" name="tags" placeholder="Enter tags separated by commas"/>
                    <small class="form-text text-muted">Example: travel, beach, summer</small>
                </div>
                
                <!-- Thumbnail Upload Field -->
                <div class="form-group">
                    <label for="thumbnail">Upload a Thumbnail Image</label>
                    <input type="file" class="form-control-file" id="thumbnail" name="thumbnail" accept="image/*"/>
                    <small class="form-text text-muted">Optional - Upload a thumbnail image for your blog post.</small>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
    <div class="post-properties-wrapper">
        <div class="post-properties">
            <div class="profile-details details-card">
                <div class="author-logo post-item">
                    <img src="/content/dam/aempoc/category-travel-icon.png" alt="author-logo-image">
                </div>
                <div class="author-name post-item">
                    <span class="label">Author Name:</span>
                    <span class="value">Satish Tiwari</span>
                </div>
                <div class="author-id post-item">
                    <span class="label">Author Id:</span>
                    <span class="value">ABC123</span>
                </div>
            </div>
            <div class="post-details details-card">
                <div class="post-id post-item">
                    <span class="label">Post Id:</span>
                    <span class="value">blog_001</span>                
                </div>
                <div class="post-date post-item">
                    <span class="label">Date:</span>
                    <span class="value">02/11/2024</span>                
                </div>
            </div>
        </div>
    </div>
</div>
